 --coach-surface:#e9f0e9;--coach-border:#abc1ad;--coach-copy:#354c3e;
 margin-top:auto;padding:14px 12px;border:1px solid var(--coach-border);
 border-left:4px solid var(--coach-fill);border-radius:13px;
 background:var(--coach-surface);box-shadow:0 3px 12px #243b2c0b;
 color:var(--coach-ink);min-width:0;
}
.coach-panel[data-tone="support"],.coach-panel[data-tone="balance"]{
 --coach-ink:#71451d;--coach-fill:#805025;--coach-hover:#693c19;
 --coach-surface:#fbf0e0;--coach-border:#d4b589;--coach-copy:#634a30;
}
.coach-panel .next-card{padding:0;border:0;min-width:0}
.coach-heading{display:flex;align-items:center;gap:9px;min-width:0}
.coach-icon{
 width:28px;height:28px;flex:0 0 28px;border-radius:9px;
 background:var(--coach-fill);color:#fff;display:flex;align-items:center;justify-content:center;
}
.coach-icon svg{width:19px;height:19px;display:block}
.coach-panel .next-eyebrow{
 margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px;text-transform:none;
 line-height:1.24;color:var(--coach-ink);overflow-wrap:normal;
}
.coach-panel .next-text{
 margin:10px 0 0;font-size:13px;font-weight:450;line-height:1.45;color:var(--coach-copy);
}
.coach-panel .strategies{display:flex;flex-direction:column;gap:7px;margin:12px 0 0;flex-wrap:nowrap}
.coach-panel .coach-action{
 display:flex;align-items:center;justify-content:flex-start;gap:8px;
 width:100%;min-height:44px;flex:0 0 auto;margin:0;padding:9px 10px;
 border:1px solid var(--coach-border);border-radius:8px;background:#fff;
 color:var(--coach-ink);font-size:13px;font-weight:650;line-height:1.25;
 text-align:left;text-decoration:none;box-shadow:0 1px 1px #243b2c05;
 transition:background-color .12s,border-color .12s;
}
.coach-panel .coach-action span:last-child{color:inherit}
.coach-panel .coach-action .action-icon{display:flex;align-items:center;flex:0 0 18px;width:18px;height:20px}
.action-icon svg{display:block;width:18px;height:20px}
.coach-panel .coach-action .action-arrow{margin-left:auto;font-size:18px;font-weight:500;line-height:1}
.coach-panel .coach-action:hover{background:var(--coach-surface);border-color:var(--coach-fill);text-decoration:none}
.coach-panel .coach-action.is-primary{background:var(--coach-fill);border-color:var(--coach-fill);color:#fff;box-shadow:none}
.coach-panel .coach-action.is-primary:hover{background:var(--coach-hover);border-color:var(--coach-hover)}
.coach-panel .coach-action:focus-visible{outline:3px solid var(--coach-fill);outline-offset:3px}
.coach-panel .coach-action:active{transform:translateY(1px)}
.coach-panel.coach-arrival{animation:coach-notice 1s ease-out 1}
@keyframes coach-notice{
 0%{box-shadow:0 0 0 4px var(--coach-border),0 6px 18px #243b2c18;transform:translateY(3px)}
 100%{box-shadow:0 0 0 0 transparent,0 3px 12px #243b2c0b;transform:translateY(0)}
}

<script>
'use strict';
/* Exakte Bruch- und Wurzelrechnung. Keine Ausführung von Eingaben (kein eval),
   kein CDN, keine numerischen Stichproben als Beweis einer richtigen Lösung. */
class MathInputError extends Error {}
class MathDomainError extends Error {}
class MathUnsupported extends Error {}
const gcd=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b){[a,b]=[b,a%b];}return a||1n;};
class Q {
  constructor(n=0n,d=1n){n=BigInt(n);d=BigInt(d);if(String(n).length+String(d).length>3000)throw new MathUnsupported('Vereinfache zuerst die sehr großen Zahlen oder Exponenten.');if(!d)throw new MathDomainError('Division durch null.');if(d<0n){n=-n;d=-d;}let g=gcd(n,d);this.n=n/g;this.d=d/g;}
  static of(v){if(v instanceof Q)return v;let s=String(v);if(s.includes('.')){let [a,b]=s.split('.');return new Q(BigInt(a+b),10n**BigInt(b.length));}return new Q(BigInt(s));}
  add(b){b=Q.of(b);return new Q(this.n*b.d+b.n*this.d,this.d*b.d);}

/* Strukturierter 2-D-Editor: Jede Vorlage enthält echte, einzeln anwählbare
   Eingabefelder. Die Prüfung erhält ausschließlich den serialisierten Term. */
let sequenceNumber=0;
const seq=(c=[])=>({k:'seq',id:++sequenceNumber,c});
const atom=v=>({k:'atom',v:String(v)});
const chars=s=>[...String(s)].map(atom);
function editorFromAst(a){
 const build=(b,types=[])=>types.includes(b.t)?[fenceTree(seq(editorFromAst(b)))]:editorFromAst(b);
 switch(a.t){
  case 'num':{const n=numberTree(a.v);return n.k==='fraction'?[fracTree(seq(chars(n.num.v)),seq(chars(n.den.v)))]:chars(n.v);}
  case 'sym':return [atom(a.v)];
  case 'neg':return [atom('−'),...build(a.a,['add','sub'])];
  case 'add':case 'sub':return [...build(a.a),atom(a.t==='add'?'+':'−'),...build(a.b,a.t==='sub'?['add','sub']:[])];
  case 'mul':return [...build(a.a,['add','sub']),...(a.dot?[atom('·')]:[]),...build(a.b,['add','sub','neg'])];
  case 'div':return [fracTree(seq(build(a.a)),seq(build(a.b)))];
  case 'pow':return [powerTree(seq(build(a.a,['add','sub','mul','div','neg'])),seq(build(a.b)))];
  case 'sqrt':return [rootTree(seq(build(a.a)))];
  case 'abs':return [fenceTree(seq(build(a.a)),'abs')];
 }
}
function serializeEditor(n){
 switch(n.k){
  case 'seq':return n.c.length?n.c.map(serializeEditor).join(''):'□';
  case 'atom':return n.v;
  case 'root':return `sqrt(${serializeEditor(n.body)})`;
  case 'abs':return `abs(${serializeEditor(n.body)})`;
  case 'paren':return `(${serializeEditor(n.body)})`;
  case 'fraction':return `((${serializeEditor(n.num)})/(${serializeEditor(n.den)}))`;
  case 'power':return `(${serializeEditor(n.base)})^(${serializeEditor(n.exp)})`;
  default:throw new Error('Ungültige Eingabevorlage.');
 }
}
function normalizeEditor(tree){
 let count=0;function read(n,depth=0){
  if(!n||typeof n!=='object'||++count>180||depth>22)throw new Error('Ungültiger Entwurf.');
  if(n.k==='seq'){if(!Array.isArray(n.c))throw new Error('Ungültiges Eingabefeld.');return seq(n.c.map(c=>read(c,depth+1)));}
  if(n.k==='atom'){if(!/^[a-z0-9,+−·:.]$/i.test(n.v))throw new Error('Ungültiges Zeichen.');return atom(n.v.toLowerCase().replace('.',','));}
  if(['root','abs','paren'].includes(n.k)){if(n.body?.k!=='seq')throw new Error('Fehlendes Eingabefeld.');return {k:n.k,body:read(n.body,depth+1)};}
  if(n.k==='fraction'){if(n.num?.k!=='seq'||n.den?.k!=='seq')throw new Error('Fehlendes Bruchfeld.');return fracTree(read(n.num,depth+1),read(n.den,depth+1));}
  if(n.k==='power'){if(n.base?.k!=='seq'||n.exp?.k!=='seq')throw new Error('Fehlendes Potenzfeld.');return powerTree(read(n.base,depth+1),read(n.exp,depth+1));}
  throw new Error('Unbekannte Vorlage.');
 }const out=read(tree);if(out.k!=='seq')throw new Error('Ungültiger Entwurf.');return out;
}
const Editor={
 root:seq(),cursor:null,sequences:new Map(),parents:new Map(),history:[],future:[],box:null,
 index(){
  this.sequences.clear();this.parents.clear();
  const visit=(s,ctx=null)=>{this.sequences.set(s.id,s);if(ctx)this.parents.set(s.id,ctx);s.c.forEach((n,i)=>{const add=(field)=>visit(n[field],{node:n,parent:s,index:i,field});if(['root','abs','paren'].includes(n.k))add('body');if(n.k==='fraction'){add('num');add('den');}if(n.k==='power'){add('base');add('exp');}});};visit(this.root);
  if(!this.cursor||!this.sequences.has(this.cursor.sid))this.cursor={sid:this.root.id,index:this.root.c.length};
  this.cursor.index=Math.min(this.cursor.index,this.current().c.length);
 },
 current(){return this.sequences.get(this.cursor.sid)||this.root;},
 snapshot(){return JSON.stringify({tree:this.root,cursor:this.cursor});},
 restore(s){let x=JSON.parse(s);this.root=x.tree;this.cursor=x.cursor;this.index();},
 text(){return this.root.c.length?serializeEditor(this.root):'';},
 export(){return JSON.parse(JSON.stringify(this.root));},
 load(text='',stored=null){
  this.history=[];this.future=[];

   this.root=seq();this.cursor={sid:this.root.id,index:0};this.index();
   /* Ältere, unvollständige Entwürfe werden soweit möglich als Vorlagen geladen. */
   const tokens=String(text).replace(/sqrt\s*\(/gi,'√').replace(/abs\s*\(/gi,'|').replace(/[\[\]{}]/g,c=>'[{'.includes(c)?'(':')').match(/√|[a-z0-9,.*+\-−/:()|^²³]/gi)||[];

 },

 },

 },

   if(p.node.k==='power'&&dir<0&&p.field==='base'){target=p.node.exp;break;}

   s=p.parent;p=this.parents.get(s.id);
  }
  if(!target){const s0=this.current(),i=this.cursor.index,n=s0.c[i-1]?.k==='fraction'||s0.c[i-1]?.k==='power'?s0.c[i-1]:s0.c[i];if(n?.k==='fraction')target=dir<0?n.num:n.den;else if(n?.k==='power'&&dir<0)target=n.exp;}
  if(target){const b=this.box,old=b?.stops.find(p=>p.sid===this.cursor.sid&&p.index===this.cursor.index),stops=b?.stops.filter(p=>p.sid===target.id)||[];const best=old&&stops.length?stops.reduce((a,b)=>Math.abs(a.x-old.x)<=Math.abs(b.x-old.x)?a:b):null;this.go(target,best?.index??target.c.length);}

 if(result.ok){let more=needsMore(ast,current);if(more){r.partial=true;r.lastOutcome='partial';setFeedback('partial','Richtiger Zwischenschritt.',more.text);}else{if(!r.solved)r.firstTry=r.attempts===1&&!r.hints;r.solved=true;r.lastOutcome='solved';setFeedback('good','Richtig.',current.n===11?'Der gesamte Vorfaktor steht unter der Wurzel.':'Dein Term ist vollständig vereinfacht.');}}
 else{let d=diagnose(ast,result,current);if(!repeat){r.wrong++;r.errors[d.code]=(r.errors[d.code]||0)+1;}r.lastOutcome='wrong';setFeedback('wrong','Noch nicht gleichwertig.',d.text);}
 renderNav();renderProgress();renderNext();save();
 if(!repeat&&!result.ok&&r.wrong>0&&r.wrong%3===0){openHelp(true);return;}
 let count=uniqueAttempts();if(!repeat&&imbalance()&&count-(Number(state.flags.balanceAt)||0)>=3){state.flags.balanceAt=count;save();openBalance();}
}
function fitMath(el,base,maxHeight=Infinity){
 if(!el)return;const svg=el.querySelector('.math-svg');if(!svg)return;
 el.style.fontSize=base+'px';
 const w=Number(svg.dataset.mathWidth),h=Number(svg.dataset.mathHeight);
 el.style.fontSize=Math.max(12,Math.min(base,Math.max(12,el.clientWidth-3)/w,maxHeight/h))+'px';
}

  return bottom<=rect.bottom-parseFloat(getComputedStyle(side).paddingBottom)+1;
 };

function openModal(title,body,actions=[],kind='generic'){
 if(!modalOpen)previousFocus=document.activeElement;modalOpen=true;modalKind=kind;$('modal').dataset.kind=kind;$('modal').classList.remove('concept-compact','concept-inline');$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML='';$('modalActions').hidden=actions.length===0;for(let a of actions){let b=document.createElement('button');b.type='button';b.className='btn '+(a.kind||'');b.textContent=a.text;b.addEventListener('click',a.fn);$('modalActions').appendChild(b);}$('overlay').hidden=false;requestAnimationFrame(()=>{fitAll();$('closeModal').focus({preventScroll:true});});}

const COLORS={a:'#587895',b:'#a27b48'};
function initLaws(){for(let [i,terms]of [[1,['sqrt(a)*sqrt(b)','sqrt(ab)']],[2,['sqrt(a)/sqrt(b)','sqrt(a/b)']],[3,['sqrt(a^2)','|a|']]])$('lawFormula'+i).innerHTML=eqHTML(terms,COLORS);$('lawFormula3b').innerHTML=eqHTML(['sqrt(a^2)','a'],COLORS);}
function lawEquation(n,a,b,final=''){
 const A=colorTree(mathTree(parseMath(a)),COLORS.a),BB=b?colorTree(mathTree(parseMath(b)),COLORS.b):null;
 let terms;
 if(n===1)terms=[row(rootTree(A),op('·'),rootTree(BB)),rootTree(row(A,op('·'),BB))];
 if(n===2)terms=[fracTree(rootTree(A),rootTree(BB)),rootTree(fracTree(A,BB))];
 if(n===3)terms=[rootTree(powerTree(parseMath(a).t==='sym'?A:fenceTree(A),glyph('2'))),fenceTree(A,'abs')];
 if(final)terms.push(mathTree(parseMath(final)));
 return treeHTML(row(terms.flatMap((t,i)=>[i?op('='):null,t])),a+(b?' und '+b:''));
}
function openLaw(n){document.querySelectorAll('.law').forEach(e=>e.classList.toggle('active',e.id==='law'+n));let rows=[];
 if(n===1)rows=[['Mit Zahlen',lawEquation(1,'9','4','6'),''],['Mit anderen Buchstaben',lawEquation(1,'x','y'),'x, y ≥ 0'],['Ein Buchstabe steht für einen Term',lawEquation(1,'2x','3'),'a = 2x, b = 3; x ≥ 0']];
 if(n===2)rows=[['Mit Zahlen',lawEquation(2,'36','4','3'),''],['Mit anderen Buchstaben',lawEquation(2,'x','y'),'x ≥ 0, y > 0'],['Ein Buchstabe steht für einen Term',lawEquation(2,'4u^2','9'),'a = 4u², b = 9; u ∈ ℝ']];
 if(n===3)rows=[['Mit einer negativen Zahl',lawEquation(3,'-5',null,'5'),'Die Quadratwurzel ist nichtnegativ.'],['Mit einem anderen Buchstaben',lawEquation(3,'t'),'Für t ≥ 0 ist |t| = t.'],['Ein Buchstabe steht für einen Term',lawEquation(3,'x-2'),'a = x − 2. Für x ≥ 2 ist |x − 2| = x − 2.']];
 openModal(['','Wurzeln multiplizieren','Wurzeln dividieren','Wurzel aus einem Quadrat'][n],rows.map(([title,formula,note])=>`<section class="law-example"><div class="law-example-label">${title}</div><div class="law-example-math">${formula}</div>${note?`<div class="law-example-note">${esc(note)}</div>`:''}</section>`).join(''),[],'law');}
/* Every mathematical expression uses the same 2-D renderer as the editor. */
function conceptText(text){
 let out='',last=0;const re=/\[\[([^\]]+)\]\]/g;let match;
 while((match=re.exec(text))){out+=esc(text.slice(last,match.index));out+=eqHTML(match[1].split(' = '));last=match.index+match[0].length;}
 return out+esc(text.slice(last));
}
function conceptFormula(terms,continued=false){
 const tree=row(continued?op('='):null,terms.flatMap((term,i)=>[i?op('='):null,mathTree(parseMath(term))]));
 return `<div class="concept-math">${treeHTML(tree,(continued?'= ':'')+terms.join(' = '))}</div>`;
}
function conceptSteps(e){
 return `<div class="concept-steps">${e.steps.map((s,i)=>
  `<section class="concept-step"><div class="concept-step-heading"><span class="concept-step-number" aria-hidden="true">${i+1}</span><div class="concept-step-label">${esc(s.label)}</div></div>${s.math.map(terms=>conceptFormula(terms,!!s.continued)).join('')}</section>`
 ).join('')}</div>${e.note?`<p class="concept-note">${conceptText(e.note)}</p>`:''}`;
}
function fitConceptExample(){
 if(!modalOpen||modalKind!=='example')return;
 const modal=$('modal'),body=$('modalBody');modal.classList.remove('concept-compact','concept-inline');
 const base=innerWidth<=680?22:innerWidth<=900?25:27;
 const formulas=[...body.querySelectorAll('.concept-step .concept-math')];
 const fit=size=>{
  for(const el of formulas){
   const svg=el.querySelector('.math-svg');if(!svg)continue;
   el.style.fontSize=Math.max(18,Math.min(size,(el.clientWidth-3)/Number(svg.dataset.mathWidth)))+'px';
  }
 };
 const fits=()=>{
  const styles=getComputedStyle(modal),head=modal.querySelector('.modal-header');
  const available=innerHeight-2*parseFloat(getComputedStyle($('overlay')).paddingTop);
  const used=parseFloat(styles.paddingTop)+parseFloat(styles.paddingBottom)+2+
   head.offsetHeight+parseFloat(getComputedStyle(head).marginBottom)+body.scrollHeight+
   $('modalActions').offsetHeight+parseFloat(getComputedStyle($('modalActions')).marginTop);
  return used<=available+1;
 };
 fit(base);
 if(!fits()){modal.classList.add('concept-compact');fit(base);}
 if(!fits()&&modal.clientWidth>=520){modal.classList.add('concept-inline');fit(base);}
 if(!fits())for(let size=base-1;size>=20;size--){fit(size);if(fits())break;}
}
let exampleStage='numbers';
function renderExample(stage='numbers',moveFocus=false){
 const e=EXAMPLES[current.example];if(!e)return;
 exampleStage=stage==='variables'?'variables':'numbers';
 const concrete=exampleStage==='variables',part=concrete?e.concrete:e.numbers;
 document.querySelectorAll('.law').forEach(el=>el.classList.toggle('active',e.laws.includes(Number(el.id.slice(3)))));
 const body=`<div class="concept-meta"><span class="concept-kicker"><span class="example-stage-count">${concrete?'2':'1'} / 2</span>${concrete?'Mit Variablen':'Mit Zahlen'}</span>${part.domain?`<span class="concept-domain">${esc(part.domain)}</span>`:''}</div>
  <p class="concept-question">${conceptText(e.question)}</p>
  <div class="concept-way" id="conceptWay" tabindex="-1" aria-label="${concrete?'Konkretes Beispiel mit Variablen':'Zahlenbeispiel'} zu ${esc(current.id)}">${conceptSteps(part)}</div>
  <section class="concept-transfer"><h3>Jetzt bei ${esc(current.id)}</h3><p>${conceptText(e.transfer)}</p></section>`;
 const actions=concrete?
  [{text:'Zahlenbeispiel',fn:()=>renderExample('numbers',true)},{text:`Zurück zu ${current.id}`,kind:'primary',fn:closeModal}]:
  [{text:'Konkretes Beispiel',kind:'primary',fn:showConcreteExample},{text:`Zurück zu ${current.id}`,fn:closeModal}];
 openModal(e.title,body,actions,'example');
 $('modal').dataset.exampleStage=exampleStage;$('modal').dataset.exampleTask=current.id;
 $('modalActions').firstElementChild.id=concrete?'showNumberExample':'showConcreteExample';
 if(!concrete)$('showConcreteExample').setAttribute('aria-label','Konkretes Beispiel mit Variablen');
 if(moveFocus)requestAnimationFrame(()=>{$('conceptWay')?.focus({preventScroll:true});});
}
function showConcreteExample(){if(modalOpen&&modalKind==='example')renderExample('variables',true);}

function openHelp(auto=false){let t=easierTarget(),r=rec(),intro=auto?`Bei ${current.id} waren ${r.wrong} Versuche noch nicht gleichwertig. Hole dir jetzt Hilfe bei deiner Lehrkraft.`:`Zeige deiner Lehrkraft deinen Rechenschritt zu ${current.id}. Besprecht zuerst, welcher Faktor ein Quadrat ist und welches Vorzeichen erlaubt ist.`;let body=`<p>${esc(intro)}</p>`;if(r.draft){body+=`<div class="modal-kicker">Dein letzter Ansatz</div><div class="help-math">${mathHTML(r.draft)}</div>`;}body+=`<p>Zum Wiedereinstieg passt <strong>${t.id}</strong>. Danach kannst du zu ${current.id} zurückkehren.</p>`;openModal(auto?'Bitte hole dir Hilfe.':'Hilfe bei der Lehrkraft',body,[{text:'Beispiel ansehen',kind:'primary',fn:openExample},{text:`${t.id} versuchen`,fn:()=>selectTask(t.id)},{text:'Zurück',kind:'quiet',fn:closeModal}],'help');renderNext('help');}
function openBalance(){let t=balanceTarget(),missing=[6,7,8,9,10].filter(n=>!touched(n).length);let body=missing.length?`Von ${missing.length===1?'Aufgabe':'den Aufgaben'} ${missing.join(', ')} fehlt noch jeweils eine Teilaufgabe. Bearbeite von 6 bis 10 mindestens eine Teilaufgabe.`:`Du hast bisher deutlich mehr Teilaufgaben einer Nummer bearbeitet. Aufgabe ${t.n} kam seltener dran.`;openModal('Verteile deine Übung.',`<p>${esc(body)}</p><p>Ein passender nächster Schritt ist <strong>${t.id}</strong>.</p>`,[{text:`${t.id} versuchen`,kind:'primary',fn:()=>selectTask(t.id)},{text:'Hier weiterrechnen',kind:'quiet',fn:closeModal}],'balance');}
function openOverview(){let rows=[6,7,8,9,10,11,12].map(n=>`<div class="overview-row"><div class="overview-row-label">${n}</div><div class="letters">${TASKS.filter(t=>t.n===n).map(t=>`<button type="button" class="letter-btn ${status(t.id)} ${current.id===t.id?'selected':''}" data-task="${t.id}" aria-label="${t.id}, ${stateLabel(t.id)}">${t.letter}</button>`).join('')}</div></div>`).join('');openModal('Deine Aufgaben',`<div class="overview-legend"><span class="legend-item"><span class="legend-dot"></span>richtig</span><span class="legend-item"><span class="legend-dot partial"></span>Zwischenschritt</span><span class="legend-item"><span class="legend-dot wrong"></span>versucht</span></div><div class="overview-rows">${rows}</div><div class="overview-footer"><span class="overview-goal">6–10: ${goalCount()}/5 bearbeitet · ${[6,7,8,9,10].filter(n=>solved(n).length).length}/5 richtig</span><button type="button" class="reset-button" id="resetProgress">Zurücksetzen</button></div>${!canStore?'<div class="storage-note">Der Browser lässt das dauerhafte Speichern hier nicht zu.</div>':''}`,[],'overview');$('resetProgress').addEventListener('click',()=>openModal('Übungsstand zurücksetzen?','<p>Alle gespeicherten Versuche auf diesem Gerät werden gelöscht.</p>',[{text:'Zurücksetzen',kind:'warning',fn:()=>{state=freshState();save();selectTask('6a');}},{text:'Abbrechen',kind:'quiet',fn:openOverview}],'reset'));}
