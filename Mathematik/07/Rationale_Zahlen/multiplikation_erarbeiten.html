<script>
'use strict';
(() => {
/* ---------- Exact rational arithmetic; no eval and no floating-point grading. ---------- */
class Rational {
  constructor(n, d=1n) {
    n=BigInt(n); d=BigInt(d);
    if(d===0n) throw new Error('Durch 0 kann nicht geteilt werden.');
    if(d<0n){n=-n;d=-d;}
    let x=n<0n?-n:n,y=d;while(y){[x,y]=[y,x%y];}
    const g=x||1n;this.n=n/g;this.d=d/g;
  }
  add(b){return new Rational(this.n*b.d+b.n*this.d,this.d*b.d)}
  sub(b){return new Rational(this.n*b.d-b.n*this.d,this.d*b.d)}
  mul(b){return new Rational(this.n*b.n,this.d*b.d)}
  div(b){return new Rational(this.n*b.d,this.d*b.n)}
  neg(){return new Rational(-this.n,this.d)}
  abs(){return new Rational(this.n<0n?-this.n:this.n,this.d)}
  eq(b){return this.n===b.n&&this.d===b.d}
  num(){return Number(this.n)/Number(this.d)}
  pack(){return [this.n.toString(),this.d.toString()]}
  key(){return `${this.n}/${this.d}`}
}
const R=(n,d=1)=>new Rational(n,d);
const unpack=a=>new Rational(a[0],a[1]);
function decimalLiteral(s){
  s=String(s).replace(',','.');
  if(!/^(?:\d+(?:\.\d+)?|\.\d+)$/.test(s))throw new Error('Diese Zahl ist noch nicht vollständig.');
  const [whole,tail='']=s.split('.');
  if((whole+tail).length>14||tail.length>8)throw new Error('Bitte höchstens 14 Ziffern und 8 Nachkommastellen eingeben.');
  return new Rational(BigInt((whole||'0')+tail),10n**BigInt(tail.length));
}
function parseInput(source, resultOnly=true){
  let s=String(source).trim().replace(/−/g,'-').replace(/[×·xX]/g,'*').replace(/÷/g,'/').replace(/\s/g,'');
  if(!s)throw new Error('Gib zuerst ein Ergebnis ein.');
  if(s.length>120)throw new Error('Die Eingabe ist zu lang.');
  if(/[^\d.,+\-*/()]/.test(s))throw new Error('Verwende Zahlen, Vorzeichen und bei Brüchen einen Bruchstrich.');
  const tokens=s.match(/(?:\d+(?:[.,]\d*)?|[.,]\d+)|[+\-*/()]/g)||[];
  if(tokens.join('')!==s||tokens.length>80)throw new Error('Prüfe die Schreibweise deiner Eingabe.');
  let pos=0,binary=0,divisions=0,unaries=0,depth=0;
  function atom(){
    if(++depth>20)throw new Error('Zu viele Klammern.');
    let value;
    if(tokens[pos]==='('){pos++;value=expression();if(tokens[pos++]!==')')throw new Error('Eine schließende Klammer fehlt.');}
    else {const t=tokens[pos++];if(!t||!/[\d.,]/.test(t[0]))throw new Error('Hier fehlt noch eine Zahl.');value=decimalLiteral(t);}
    depth--;return value;
  }
  function unary(){if(tokens[pos]==='+'||tokens[pos]==='-'){const op=tokens[pos++];unaries++;const v=unary();return op==='-'?v.neg():v;}return atom();}
  function term(){let a=unary();while(tokens[pos]==='*'||tokens[pos]==='/'){const op=tokens[pos++];if(op==='*')binary++;else divisions++;const b=unary();a=op==='*'?a.mul(b):a.div(b);}return a;}
  function expression(){let a=term();while(tokens[pos]==='+'||tokens[pos]==='-'){const op=tokens[pos++];binary++;const b=term();a=op==='+'?a.add(b):a.sub(b);}return a;}
  const value=expression();
  if(pos!==tokens.length)throw new Error('Prüfe die Klammern und Rechenzeichen.');
  if(resultOnly&&(binary>0||divisions>1||unaries>2||(divisions===0&&unaries>1)))throw new Error('Gib das ausgerechnete Ergebnis ein, nicht die Aufgabe. Ein einzelner Bruch ist erlaubt.');
  return value;
}
function decimalText(r){
  const neg=r.n<0n,ar=r.abs();let den=ar.d,two=0,five=0;
  while(den%2n===0n){den/=2n;two++;}while(den%5n===0n){den/=5n;five++;}
  if(den!==1n||Math.max(two,five)>8)return null;
  const digits=Math.max(two,five),scale=10n**BigInt(digits),v=ar.n*(scale/ar.d);
  if(digits===0)return (neg?'−':'')+v;
  let str=v.toString().padStart(digits+1,'0');
  str=str.slice(0,-digits)+','+str.slice(-digits).replace(/0+$/,'');
  if(str.endsWith(','))str=str.slice(0,-1);
  return (neg?'−':'')+str;
}
function plain(r,fmt='auto',positive=false){
  const sign=r.n<0n?'−':(positive&&r.n>0n?'+':'');

 const totals=state.levels.reduce((a,l)=>({independent:a.independent+l.independent,helped:a.helped+l.helped,corrected:a.corrected+(l.corrected||0)}),{independent:0,helped:0,corrected:0});
 const st=state.levels[state.level];
 openModal('Dein Lernweg',`<div class="progress-numbers"><div><strong>${totals.independent}</strong><small>selbstständig gelöst</small></div><div><strong>${totals.corrected}</strong><small>selbst korrigiert</small></div><div><strong>${totals.helped}</strong><small>mit Hilfe bearbeitet</small></div></div><p class="small muted">Für den Aufstieg reichen fünf richtige Aufgaben ohne Hilfe. Der Generator deckt dabei alle vier Vorzeichenkombinationen ab; die fünfte Aufgabe prüft das Verständnis.</p><div class="path-levels">${LEVELS.map((l,i)=>`<button class="path-level ${i===state.level?'current':''}" data-action="select-level" data-level="${i}" ${i>state.unlocked?'disabled':''}><span class="seal ${state.levels[i].mastered?'earned':''}" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><span class="level-info"><strong>${l.name}</strong><small>${l.detail}</small></span><span class="level-state">${state.levels[i].mastered?'✓ Abzeichen':i===state.level?'Aktuell':i>state.unlocked?'Gesperrt':'Üben'}</span></button>`).join('')}</div>${eligible()&&state.level<5?'<div class="modal-actions"><button class="button primary" data-action="offer-promotion">Nächste Stufe ansehen</button></div>':''}<div class="notice">Abzeichen: ${state.levels.filter(x=>x.mastered).length} / 6. Wiederholen nimmt dir kein Abzeichen weg.</div>`,'path');
}
function showSettings(){
 openModal('Einstellungen',`<div class="setting-row"><label for="setting-motion"><input id="setting-motion" type="checkbox" data-setting="motion" ${!state.settings.motion?'checked':''}><span>Ohne Bewegungsanimationen<small>„Bewegung reduzieren“ des Geräts wird immer beachtet.</small></span></label></div><div class="setting-row"><label for="setting-keyboard"><input id="setting-keyboard" type="checkbox" data-setting="systemKeyboard" ${state.settings.systemKeyboard?'checked':''}><span>Systemtastatur zusätzlich öffnen<small>Eine angeschlossene Tastatur funktioniert auch ohne diese Option.</small></span></label></div><div class="storage-box"><p><strong>${storageOK&&!externalChange?'Lernstand lokal gespeichert':'Speicher benötigt Aufmerksamkeit'}</strong></p><p>Der Stand liegt nur in diesem Browser unter dieser Webadresse. Kein Konto, keine Übertragung, keine Synchronisierung.</p><p>Auf geteilten iPads: eigenen Stand exportieren und vor der nächsten Person zurücksetzen. Gelöschte Browserdaten oder private Sitzungen können den Stand entfernen.</p>${location.protocol==='file:'?'<p>Bei direkt geöffneten Dateien ist das Speichern browserabhängig. Für den Unterricht dieselbe statisch gehostete Webadresse verwenden.</p>':''}${externalChange?'<p>Zum Schutz eines vorhandenen Stands ist das Speichern vorübergehend angehalten.</p>':''}</div><div class="settings-buttons"><button class="button" data-action="export">Stand exportieren</button><button class="button" data-action="import">Stand importieren</button></div><div id="import-message" class="import-error" role="status"></div>${externalChange?'<div class="settings-buttons" style="margin-top:12px"><button class="button" data-action="reload">Gespeicherten Stand neu laden</button><button class="button" data-action="overwrite">Diesen Stand speichern</button></div>':''}<hr class="separator"><div class="settings-buttons"><button class="button quiet" data-action="teacher">Für den Unterricht</button><button class="button danger" data-action="reset-confirm">Lernstand zurücksetzen</button></div>`,'settings');
}
function showTeacher(){
 openModal('Für den Unterricht',`<p>Die Aufträge unter <strong>Entdecken</strong> führen von wiederholter Addition über ein Zahlenmuster zur Subtraktion negativer Zahlen. Unter <strong>Üben</strong> bleibt die Lösung bis zur Bearbeitung verdeckt.</p><div class="notice">Kurze Sicherung im Gespräch: „Warum muss (−3) · (−2) gleich +6 sein?“</div><h3>Was für den Aufstieg zählt</h3><p>Fünf richtige Aufgaben ohne Hilfe reichen für den Aufstieg. Die ersten Aufgaben decken gezielt alle vier Vorzeichenkombinationen ab; danach folgt ein Verständnischeck. Fehler oder Hilfen führen zu zusätzlichen Aufgaben. Das ist eine Übungsregel, kein standardisierter Diagnosetest.</p><p>Beim Entdecken bleibt die Skala unverändert, bis ein Pfeil mehr Platz braucht. Die Lupe passt den Ausschnitt auf ausdrücklichen Wunsch an. So bleibt eine Vergleichsfolge normalerweise auf derselben Skala.</p><p>Fehlerhafte Schreibweisen zählen nicht als Rechenfehler. Wiederholte Fehler in derselben Aufgabe zählen nur einmal zur Fehlerserie. Nach drei fehlerhaften Erstversuchen auf verschiedenen Aufgaben wird Unterstützung angeboten, nie automatisch zurückgestuft.</p><p>Frühere Stufen erscheinen nach jeweils sechs abgeschlossenen Aufgaben und nach einer Rückkehr an einem anderen Tag als Rückblick. Ein anderer Browser oder eine andere Website (andere Domain, anderes Protokoll oder anderer Port) hat einen eigenen Lernstand.</p><h3>Zwischenstand</h3><table class="teacher-table"><thead><tr><th scope="col">Stufe</th><th scope="col">Ohne Hilfe</th><th scope="col">Fehler im Erstversuch</th></tr></thead><tbody>${LEVELS.map((l,i)=>`<tr><th scope="row">${i+1} · ${l.name}</th><td>${state.levels[i].independent}</td><td>${state.levels[i].wrong}</td></tr>`).join('')}</tbody></table><h3>Vorwissen auffrischen</h3><div class="settings-buttons"><button class="button" data-action="warmup-decimal">Dezimalzahlen</button><button class="button" data-action="warmup-fraction">Brüche</button></div><h3>Direktstart für den Unterricht</h3><p class="small muted">Öffnet eine Stufe, ohne dafür ein Abzeichen zu vergeben. Diese Einstellung ist nicht passwortgeschützt.</p><label class="entry-label" for="teacher-level">Startstufe</label><select id="teacher-level">${LEVELS.map((l,i)=>`<option value="${i}" ${state.level===i?'selected':''}>${i+1} · ${l.name}</option>`).join('')}</select><button class="button" data-action="teacher-start">Stufe öffnen</button><hr class="separator"><p class="small muted">Bedienung: Browserzoom bleibt frei; Regler haben zusätzliche +/−-Tasten und sind mit Pfeiltasten bedienbar. Die Bildschirmtastatur ersetzt keine Ergebnisrechnung: Terme wie 4 · 3 werden als Ergebnis nicht ausgewertet. Gleichwertige einzelne Brüche und endliche Dezimalzahlen werden exakt verglichen.</p>`,'teacher');
}
const WARMUPS={
 decimal:[
  {q:'Berechne zuerst ohne negative Zahlen.',math:'1,5 · 2 = ?',choices:['3','0,3','30'],why:'1,5 + 1,5 = 3.'},
  {q:'Noch eine Dezimalzahl mit ganzzahligem zweiten Faktor.',math:'0,4 · 3 = ?',choices:['1,2','0,12','12'],why:'0,4 + 0,4 + 0,4 = 1,2.'}
 ],
 scaling:[
  {q:'Mit 0,5 multiplizieren heißt halbieren.',math:'4 · 0,5 = ?',choices:['2','8','0,2'],why:'Die Hälfte von 4 ist 2. Der neue Pfeil ist halb so lang.'},
  {q:'Halbiere jetzt eine Dezimalzahl.',math:'0,4 · 0,5 = ?',choices:['0,2','2','0,02'],why:'Die Hälfte von 0,4 ist 0,2. Multiplizieren kann den Betrag verkleinern.'}
 ],
 fraction:[
  {q:'Welche Zahl ist genauso groß wie ein Halb?',math:numericHTML(R(1,2),'fraction'),choices:['<span class="frac"><span class="num">2</span><span class="den">4</span></span>',numericHTML(R(1,4),'fraction'),numericHTML(R(2,3),'fraction')],why:'Zähler und Nenner mit derselben Zahl multiplizieren: 1/2 = 2/4.',strip:true},
  {q:'Zwei Portionen mit je drei Vierteln.',math:numericHTML(R(3,4),'fraction')+' · 2 = ?',choices:[numericHTML(R(3,2),'fraction'),numericHTML(R(3,8),'fraction'),numericHTML(R(3,4),'fraction')],why:'3/4 + 3/4 = 6/4 = 3/2. Ein Bruch kann größer als 1 sein.'},
  {q:'Zähler mal Zähler. Nenner mal Nenner.',math:numericHTML(R(3,4),'fraction')+' · '+numericHTML(R(2,3),'fraction')+' = ?',choices:[numericHTML(R(1,2),'fraction'),numericHTML(R(5,7),'fraction'),numericHTML(R(3,4),'fraction')],why:'(3 · 2)/(4 · 3) = 6/12 = 1/2. Gleichwertige Brüche dürfen gekürzt werden.'},
  {q:'Verbinde Bruch und Dezimalzahl.',math:numericHTML(R(3,2),'fraction')+' = ?',choices:['1,5','0,15','3,2'],why:'3/2 ist eineinhalb, also 1,5.'}
 ]
};
function maybeWarmup(level){const key=level===2?'decimal':level===3?'scaling':level===4?'fraction':level===5&&!state.warmups.fraction?'fraction':null;if(key&&!state.warmups[key])openWarmup(key,true,Math.max(0,level-1));}
function openWarmup(key,required=false,returnLevel=state.level,advance=false){
 const context={key,index:0,correct:false,selected:-1,feedback:null,order:shuffle([0,1,2]),required,returnLevel,advance};renderWarmup(context);
}
function renderWarmup(c){
 const list=WARMUPS[c.key],q=list[c.index];
 openModal(c.key==='fraction'?'Brüche auffrischen':c.key==='scaling'?'Mit Dezimalzahlen verkleinern':'Dezimalzahlen auffrischen',`<div class="warmup-progress">Vorwissen · ${c.index+1} / ${list.length}</div><p class="warmup-question">${q.q}</p><div class="task-expression math">${q.math}</div>${q.strip?'<div class="fraction-strip" role="img" aria-label="Ein Rechteck in vier gleiche Teile geteilt. Zwei Teile sind markiert."><i class="filled"></i><i class="filled"></i><i></i><i></i></div>':''}<div class="choice-list">${c.order.map((id,i)=>`<button class="choice math ${c.selected===i?(c.correct?'selected-right':'selected-wrong'):''}" data-warmup-choice="${i}" ${c.correct?'disabled':''}>${q.choices[id]}</button>`).join('')}</div><div class="feedback ${c.correct?'good':c.feedback?'bad':''}" role="status">${c.feedback?esc(c.feedback):''}</div><div class="modal-actions"><button class="button" data-action="close-modal">${c.required?'Noch ohne diese Stufe':'Schließen'}</button>${c.correct?`<button class="button primary" data-action="warmup-next">${c.index===list.length-1?'Fertig':'Weiter'}</button>`:''}</div><p class="small muted" style="margin-top:16px;margin-bottom:0">Diese Auffrischung verändert deine Vorzeichen-Abzeichen nicht.</p>`,'warmup',c);
}
function checkWarmup(choice){
 const c=modalContext;if(modalMode!=='warmup'||c.correct)return;c.selected=choice;c.correct=c.order[choice]===0;c.feedback=c.correct?WARMUPS[c.key][c.index].why:'Noch nicht. '+WARMUPS[c.key][c.index].why;renderWarmup(c);announce(c.feedback);
}
function nextWarmup(){const c=modalContext;if(!c?.correct)return;if(c.index<WARMUPS[c.key].length-1){c.index++;c.correct=false;c.feedback=null;c.selected=-1;c.order=shuffle([0,1,2]);renderWarmup(c);}else{state.warmups[c.key]=true;save();const advance=c.advance;closeModal(false);if(advance){newTask();renderAll();}announce('Vorwissen aufgefrischt.');focusTask();}}
/* ---------- Local export/import, deliberate reset and storage conflict handling. ---------- */
function exportState(){save();const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`zahlenwege-lernstand-${day()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);announce('Lernstand als Datei exportiert.');}
function confirmReset(){openModal('Lernstand zurücksetzen?',`<p>Aufgaben, Eingaben und Abzeichen dieses Browsers werden gelöscht. Ein zuvor exportierter Stand bleibt erhalten.</p><div class="modal-actions"><button class="button" data-action="settings">Abbrechen</button><button class="button danger" data-action="reset-now">Jetzt zurücksetzen</button></div>`,'reset');}
function resetNow(){const settings={...state.settings};state=freshState();state.settings=settings;externalChange=false;storageMessage='';closeModal(false);save();renderAll();announce('Neuer Lernstand.');}
async function importFile(file){
 if(!file)return;
 try{
  if(file.size>1500000)throw new Error('Die Datei ist zu groß. Bitte eine exportierte Zahlenwege-Datei wählen.');
  const raw=JSON.parse(await file.text()),loaded=validateState(raw);
  const total=loaded.practice.total;
  openModal('Lernstand übernehmen?',`<p>Der importierte Stand enthält <strong>${total} abgeschlossene Aufgaben</strong> und ist in <strong>Stufe ${loaded.level+1}: ${LEVELS[loaded.level].name}</strong>.</p><p>Der aktuelle Stand in diesem Browser wird ersetzt. Exportiere ihn vorher, falls du ihn behalten möchtest.</p><div class="modal-actions"><button class="button" data-action="settings">Abbrechen</button><button class="button primary" data-action="confirm-import">Stand übernehmen</button></div>`,'import',{loaded});
 }catch(err){showSettings();$('import-message').textContent='Import nicht möglich: '+err.message;announce('Import nicht möglich.');}
 finally{$('import-file').value='';}
}
/* ---------- Controls: touch, keyboard and zoom-friendly vertical sliders. ---------- */
function exploreStep(){return state.explore.format==='integer'?1:state.explore.format==='decimal'?.5:.25;}
function changeFactor(k,value,live=true){
 if(state.mode!=='explore'||displayState().locked)return;
 const step=exploreStep();state.explore[k]=Math.max(-5,Math.min(5,Math.round(value/step)*step));
 if(!state.explore.free&&GUIDE[state.explore.step].type==='setting'&&state.explore.done){state.explore.done=false;state.explore.feedback=null;renderExplore();}
 renderModel(live);save(true);
}
function pointerValue(event,slider){const rect=slider.getBoundingClientRect(),usable=Math.max(1,rect.height-32),ratio=Math.max(0,Math.min(1,(event.clientY-rect.top-16)/usable));return 5-ratio*10;}
function cancelDrag(restore=false){if(!activeDrag)return;const drag=activeDrag;activeDrag=null;try{drag.slider.releasePointerCapture(drag.id);}catch(e){}if(restore){state.explore[drag.key]=drag.start;renderModel();save(true);}}
function bindSliders(){
 for(const k of ['a','b']){
  const el=$('slider-'+k);el.querySelector('.slider-ticks').innerHTML=Array.from({length:11},(_,i)=>`<i style="top:${i*10}%"></i>`).join('');
  el.addEventListener('keydown',e=>{
   if(el.getAttribute('aria-disabled')==='true')return;const step=exploreStep();let v=state.explore[k];
   if(['ArrowUp','ArrowRight'].includes(e.key))v+=step;else if(['ArrowDown','ArrowLeft'].includes(e.key))v-=step;else if(e.key==='Home')v=-5;else if(e.key==='End')v=5;else if(e.key==='PageUp')v+=step*2;else if(e.key==='PageDown')v-=step*2;else return;
   e.preventDefault();changeFactor(k,v);
  });
  el.addEventListener('pointerdown',e=>{
   if(el.getAttribute('aria-disabled')==='true'||e.button>0||pointerTouches.size>1)return;
   activeDrag={slider:el,key:k,id:e.pointerId,start:state.explore[k]};el.focus({preventScroll:true});try{el.setPointerCapture(e.pointerId);}catch(error){}changeFactor(k,pointerValue(e,el));
  });
  el.addEventListener('pointermove',e=>{if(activeDrag?.id===e.pointerId&&pointerTouches.size<=1)changeFactor(k,pointerValue(e,el));});
  el.addEventListener('pointerup',e=>{if(activeDrag?.id===e.pointerId){cancelDrag();save();}});
  el.addEventListener('pointercancel',e=>{if(activeDrag?.id===e.pointerId)cancelDrag(true);});
 }
 document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){pointerTouches.add(e.pointerId);if(pointerTouches.size>1)cancelDrag(true);}},true);
 for(const name of ['pointerup','pointercancel'])document.addEventListener(name,e=>pointerTouches.delete(e.pointerId),true);
}
function enterKey(key){
 const input=$('answer-input');if(!input||input.readOnly)return;
 let start=input.selectionStart??input.value.length,end=input.selectionEnd??start;
 if(key==='clear'){input.value='';start=0;}
 else if(key==='sign'){
  try{input.value=plain(parseInput(input.value).neg(),/[÷/]/.test(input.value)?'fraction':'auto');start=input.value.length;}
  catch(error){if(/^[−-]/.test(input.value)){input.value=input.value.slice(1);start=Math.max(0,start-1);}else if(input.value.startsWith('+')){input.value='−'+input.value.slice(1);}else{input.value='−'+input.value;start++;}}
 }
 else if(key==='back'){if(start===end&&start>0)start--;input.setRangeText('',start,end,'end');start=input.selectionStart;}
 else{if(input.value.length-(end-start)+key.length>120)return;input.setRangeText(key,start,end,'end');start=input.selectionStart;}
 input.focus({preventScroll:true});input.setSelectionRange(start,start);input.dispatchEvent(new Event('input',{bubbles:true}));
}
/* A single delegated listener keeps every newly rendered button keyboard-operable. */
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.key!==undefined){enterKey(b.dataset.key);return;}
 if(b.dataset.adjust){const [k,direction]=b.dataset.adjust.split(':');changeFactor(k,state.explore[k]+Number(direction)*exploreStep());return;}
 if(b.dataset.guideChoice!==undefined){checkGuide(Number(b.dataset.guideChoice));return;}
 if(b.dataset.choice!==undefined){checkPractice(Number(b.dataset.choice));return;}
 if(b.dataset.warmupChoice!==undefined){checkWarmup(Number(b.dataset.warmupChoice));return;}
 const action=b.dataset.action;if(!action)return;
 switch(action){
  case 'mode-explore':setMode('explore');break;
  case 'mode-practice':setMode('practice');break;
  case 'rule-gate-check':checkRuleGate();break;
  case 'rule-gate-explore':closeModal(false);setMode('explore');break;
  case 'free':state.explore.free=true;state.explore.feedback=null;save();renderAll();break;
  case 'guided':startGuide(state.explore.step);break;
  case 'guide-restart':startGuide(0);break;
  case 'guide-back':startGuide(state.explore.step-1);break;
  case 'guide-next':startGuide(state.explore.step+1);break;
  case 'guide-check':checkGuide();break;
  case 'rule-check-free':checkRule(true);break;
  case 'axis-fit':{if(state.mode==='explore'){const d=displayState(),m=Math.max(Math.abs(d.a.num()),Math.abs(d.a.mul(d.b).num()),.4);state.explore.extent=[.5,1,2,5,10,25].find(n=>n>=m)||25;save();renderModel();announce('Zahlengerade: von minus '+state.explore.extent+' bis plus '+state.explore.extent+'.');}break;}
  case 'swap':if(!displayState().locked){const e=state.explore;[e.a,e.b]=[e.b,e.a];e.done=false;e.feedback=null;save();renderAll();announce('Faktoren vertauscht.');}break;
  case 'practice-check':checkPractice();break;
  case 'practice-next':nextPractice();break;
  case 'help':showHelp();break;
  case 'solution':showSolution();break;
  case 'learning-path':showLearningPath();break;
  case 'settings':showSettings();break;
  case 'teacher':showTeacher();break;
  case 'close-modal':closeModal();break;
  case 'accept-promotion':acceptPromotion();break;
  case 'decline-promotion':closeModal();break;
  case 'offer-promotion':closeModal(false);showPromotion();break;
  case 'finish-path':closeModal(false);newTask();renderAll();focusTask();break;
  case 'select-level':{const level=Number(b.dataset.level);closeModal(false);if(level<=state.unlocked&&level!==state.level)switchLevel(level);else if(state.mode!=='practice')setMode('practice');break;}
  case 'support':showSupport(state.practice.current?.level??state.level,!!state.practice.current?.done);break;
  case 'support-stay':closeModal();break;
  case 'support-back':{const level=Number(b.dataset.level);closeModal(false);switchLevel(level);break;}
  case 'support-pattern':{closeModal(false);if(state.practice.current&&!state.practice.current.done){state.practice.current.usedHelp=true;state.levels[state.practice.current.level].streak=0;}state.mode='explore';startGuide(1);break;}
  case 'support-fractions':{const advance=modalContext?.advance;closeModal(false);openWarmup('fraction',false,state.level,advance);break;}
  case 'warmup-decimal':openWarmup('decimal');break;
  case 'warmup-fraction':openWarmup('fraction');break;
  case 'warmup-next':nextWarmup();break;
  case 'teacher-start':{const level=Number($('teacher-level').value);closeModal(false);switchLevel(level);break;}
  case 'export':exportState();break;
  case 'import':$('import-file').click();break;
  case 'confirm-import':{const loaded=modalContext.loaded;closeModal(false);state=loaded;externalChange=false;storageMessage='';save();renderAll();announce('Lernstand übernommen.');break;}
  case 'reset-confirm':confirmReset();break;
  case 'reset-now':resetNow();break;
  case 'reload':location.reload();break;
  case 'overwrite':openModal('Vorhandenen Stand ersetzen?',`<p>Der vorhandene Browserstand wird durch den aktuell angezeigten Stand ersetzt.</p><div class="modal-actions"><button class="button" data-action="settings">Abbrechen</button><button class="button danger" data-action="overwrite-confirm">Aktuellen Stand speichern</button></div>`,'overwrite');break;
  case 'overwrite-confirm':externalChange=false;storageMessage='';save();showSettings();break;
 }
});
document.addEventListener('input',e=>{
 const input=e.target;if(input.dataset.entry){if(input.dataset.entry==='guide')state.explore.input=input.value;else if(state.practice.current)state.practice.current.input=input.value;input.setAttribute('aria-invalid','false');save(true);}
});
document.addEventListener('keydown',e=>{
 if(e.target.id==='answer-input'&&e.key==='Enter'){e.preventDefault();if(state.mode==='practice')checkPractice();else checkGuide();}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.rule){state.explore.rule[el.dataset.rule]=el.value;state.explore.ruleFeedback=null;save();if(modalMode!=='rule-gate')renderExplore();else updateRuleExamples();return;}
 if(el.id==='explore-format'){
  state.explore.format=el.value;const step=exploreStep();for(const k of ['a','b'])state.explore[k]=Math.round(state.explore[k]/step)*step;save();renderAll();
 }
 if(el.dataset.setting){const k=el.dataset.setting;state.settings[k]=k==='motion'?!el.checked:el.checked;save();applyTheme();if($('answer-input'))$('answer-input').inputMode=state.settings.systemKeyboard?'text':'none';}
});
$('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal();});
$('import-file').addEventListener('change',e=>importFile(e.target.files[0]));
window.addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
window.addEventListener('storage',e=>{
 if(e.key!==STORAGE_KEY||e.newValue===JSON.stringify(state))return;
 externalChange=true;storageMessage='Dieser Lernstand wurde in einem anderen Tab geändert. Speichern ist angehalten, damit nichts überschrieben wird.';updateStorage();
});
let resizeTimer;
const resizeObserver=typeof ResizeObserver==='function'?new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(displayState().show)renderNumberline(displayState());},80);}):null;
if(resizeObserver)resizeObserver.observe($('numberline'));
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(displayState().show)renderNumberline(displayState());},80);});
bindSliders();renderAll();save();
if(state.mode==='practice')maybeWarmup(state.level);
})();
</script>
